<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro de Monitoreo GOZT</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--card:#131e30;--line:#26364d;--muted:#a8b6c9;--text:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:950px;margin:auto;padding:24px 16px 48px}h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 8px}p{color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:150px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:1.05rem;margin:0}.pill{border-radius:999px;padding:5px 10px;font-size:.82rem;font-weight:700;background:#334155;color:#e2e8f0}.up{background:#14532d;color:#bbf7d0}.down{background:#7f1d1d;color:#fecaca}.pending{background:#334155;color:#cbd5e1}.link{display:inline-block;color:#93c5fd;margin-top:12px;text-decoration:none}.foot{font-size:.85rem;margin-top:24px}
</style></head><body><main><header><h1>Centro de Monitoreo GOZT</h1><p>Panel independiente de disponibilidad. La comprobación automática puede retrasarse unos minutos.</p></header><div id="summary"><p>Cargando último informe…</p></div><section class="grid" id="cards" aria-live="polite"></section><p class="foot" id="updated">Todavía no hay informe publicado.</p>
<script>
const names={recepcion:"Sistema de Recepción — El Toro Reciclados",inventario:"Sistema de Inventario",localcito:"Localcito",freddy:"Freddy Rojas"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){const cards=document.getElementById("cards"),summary=document.getElementById("summary");try{const [a,b]=await Promise.all([fetch("./sites.json",{cache:"no-store"}),fetch("./status.json",{cache:"no-store"})]);if(!a.ok)throw Error("config");const sites=await a.json(),status=b.ok?await b.json():{sites:{}};let good=0,bad=0,active=0;cards.innerHTML=sites.map(s=>{const v=status.sites?.[s.id];if(s.enabled)active++;if(s.enabled&&v){if(v.ok)good++;else bad++;}const state=!s.enabled?"No activado":!v?"Pendiente":v.ok?"En línea":"Sin respuesta";const cls=!s.enabled||!v?"pending":v.ok?"up":"down";const detail=!s.enabled?(s.note||"No incluido en las comprobaciones"):v?(v.http_status?"HTTP "+v.http_status:v.error||"Comprobado"):"Esperando la primera comprobación";const link=s.url?'<a class="link" href="'+esc(s.url)+'" target="_blank" rel="noopener">Abrir sistema ↗</a>':"";return '<article class="card"><div class="top"><h2>'+esc(names[s.id]||s.name)+'</h2><span class="pill '+cls+'">'+state+'</span></div><p>'+esc(detail)+'</p>'+link+'</article>';}).join("");summary.innerHTML='<p>Sistemas activos: <strong>'+active+'</strong> · En línea: <strong>'+good+'</strong> · Con problemas: <strong>'+bad+'</strong></p>';document.getElementById("updated").textContent=status.checked_at?"Última comprobación: "+new Date(status.checked_at).toLocaleString("es-PY"):"Todavía no hay informe de comprobación.";}catch(e){summary.innerHTML="<p>No se pudo cargar la configuración del panel.</p>";}}
load();setInterval(load,60000);
</script></main></body></html>
